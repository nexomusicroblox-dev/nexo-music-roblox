function iconeRede(nome){return REDE_ICONE[(nome||'').toLowerCase().trim()]||'🔗';}

function mostrarPagina(nome){
  document.querySelectorAll('.pagina').forEach(p=>p.classList.remove('ativa'));

/* ============ API COM CACHE ============ */
async function apiGet(acao,params={}){
  const chave = 'nexo_cache_' + acao + '_' + JSON.stringify(params);
  try{
    const salvo = localStorage.getItem(chave);
    if(salvo){
      const parsed = JSON.parse(salvo);
      if(Date.now() - parsed.ts < CACHE_TTL) return parsed.dados;
    }
  }catch(e){}

  const url=new URL(API_URL);
  url.searchParams.set('acao',acao);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url.toString());
  const j=await r.json();
  if(!j.ok)throw new Error(j.erro||'Erro');

  try{ localStorage.setItem(chave, JSON.stringify({ ts: Date.now(), dados: j.dados })); }catch(e){}
  return j.dados;
}
async function apiPost(acao,dados={}){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao,...dados})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.erro||'Erro');
  return j.dados;
}

const vazio=(msg,emoji='📭')=>`<div class="vazio"><span class="emoji">${emoji}</span><p>${msg}</p></div>`;
function escapar(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function youtubeEmbed(url, opts){
  if(!url)return '';
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
  if(!m)return '';
  return youtubeEmbedId(m[1], opts);
}
function youtubeEmbedId(id, opts){
  if(!id)return '';
  const loop = opts && opts.loop ? '&loop=1&playlist=' + id : '';
  const mute = opts && opts.mute !== false ? '&mute=1' : '';
  const auto = opts && opts.autoplay !== false ? '&autoplay=1' : '';
  const controls = opts && opts.controls === false ? '&controls=0' : '';
  const rel = '&rel=0';
  return `https://www.youtube.com/embed/${id}?enablejsapi=1${auto}${mute}${loop}${controls}${rel}`;
}

function normalizarData(data){
  if(!data)return '';
  const s=String(data).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  const mBr=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(mBr){
    let [,dia,mes,ano]=mBr;
    if(ano.length===2)ano='20'+ano;
    return `${ano}-${mes.padStart(2,'0')}-${dia.padStart(2,'0')}`;
  }
  return '';
}

function gerarLinkCalendario(ev){
  if(!ev.data)return '';
  const dt=normalizarData(ev.data);
  if(!dt)return '';
  const hora=(ev.hora||'20:00').toString();
  const partes=hora.split(':');
  const hh=(partes[0]||'20').padStart(2,'0');
  const mm=(partes[1]||'00').padStart(2,'0');
  const inicio=dt.replace(/-/g,'')+'T'+hh+mm+'00';
  const fimDate=new Date(dt+'T'+hh+':'+mm);
  if(isNaN(fimDate.getTime()))return '';
  fimDate.setHours(fimDate.getHours()+2);
  const fimStr=fimDate.getFullYear()+String(fimDate.getMonth()+1).padStart(2,'0')+String(fimDate.getDate()).padStart(2,'0')+'T'+String(fimDate.getHours()).padStart(2,'0')+String(fimDate.getMinutes()).padStart(2,'0')+'00';
  const titulo=encodeURIComponent(ev.nome||'Evento Nexo');
  const desc=encodeURIComponent((ev.descricao||'').substring(0,200));
  const local=encodeURIComponent(ev.local||'Roblox');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titulo}&dates=${inicio}/${fimStr}&details=${desc}&location=${local}`;
}

function toggleSomAnuncio(idx, btn){
  const iframe = document.getElementById('iframe-anuncio-' + idx);
  if(!iframe) return;
  const estaMudo = btn.classList.contains('mudo');
  iframe.contentWindow.postMessage(JSON.stringify({
    event: 'command',
    func: estaMudo ? 'unMute' : 'mute',
    args: []
  }), '*');
  btn.classList.toggle('mudo');
  btn.textContent = estaMudo ? '🔊' : '🔇';
  btn.title = estaMudo ? 'Mutar' : 'Ativar som';
}

function mudarModo(modo){
  modoAtual=modo;
  document.getElementById('btnVisitante').classList.toggle('ativo',modo==='visitante');
  document.getElementById('btnContratante').classList.toggle('ativo',modo==='contratante');
  const aviso=document.getElementById('aviso-modo');
  if(modo==='visitante'){aviso.innerHTML='👀 Você está no modo <strong>Visitante</strong>. Explore os artistas livremente.';}
  else{aviso.innerHTML='🎤 Você está no modo <strong>Contratante</strong>. Clique em um artista para solicitar uma contratação.';}
  renderizarArtistas();
}

function abrirModal(html){
  document.getElementById('modalConteudo').innerHTML=html;
  document.getElementById('modalFundo').classList.add('ativo');
  document.body.style.overflow='hidden';
}
function fecharModal(){
  document.getElementById('modalFundo').classList.remove('ativo');
  document.getElementById('modalConteudo').innerHTML='';
  document.body.style.overflow='';
}
document.getElementById('modalFundo').addEventListener('click',e=>{if(e.target.id==='modalFundo')fecharModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal();});

  if(!a)return;
  const redes=[];
  if(a.instagram)redes.push(`<a href="${a.instagram}" target="_blank">📷 Instagram</a>`);
  if(a.youtube)redes.push(`<a href="${a.youtube}" target="_blank">▶️ YouTube</a>`);
  if(a.tiktok)redes.push(`<a href="${a.tiktok}" target="_blank">🎵 TikTok</a>`);
  const botaoContratar=modoAtual==='contratante'?`<button class="btn btn-primario" style="margin-top:20px;width:100%;" onclick="abrirFormContratacao(${a.id})">🎤 Solicitar contratação</button>`:'';
  const html=`
    ${a.foto?`<img src="${a.foto}" class="modal-img-grande" alt="${escapar(a.nome)}">`:`<div class="modal-img-sem">🎤</div>`}
    <h2 class="modal-titulo-grande">${a.nome}</h2>
    <div class="modal-descricao">${a.bio||'Sem biografia cadastrada.'}</div>
    ${redes.length?`<div class="modal-redes">${redes.join('')}</div>`:''}
    ${a.musicas?`<div class="modal-section"><h4>🎵 Músicas</h4><div class="info">${a.musicas}</div></div>`:''}

    ${botaoContratar}
  `;
  abrirModal(html);
}

async function enviarContratacao(ev,idArtista){
  ev.preventDefault();
  const form=ev.target;
  const btn=form.querySelector('button[type="submit"]');
  const msg=document.getElementById('msgForm');
  btn.disabled=true;btn.textContent='Enviando...';msg.innerHTML='';
  try{
    const dados={artista_id:idArtista};
    new FormData(form).forEach((v,k)=>dados[k]=v);
    await apiPost('solicitar_contratacao',dados);
    msg.className='msg-sucesso';
    msg.innerHTML='✅ Solicitação enviada! Entraremos em contato. 🎉';
    form.querySelectorAll('input, textarea, button').forEach(el=>el.disabled=true);
  }catch(e){
    msg.className='msg-erro-form';
    msg.textContent='❌ Erro: '+e.message;
    btn.disabled=false;btn.textContent='📩 Enviar solicitação';
  }
}

function renderizarArtistas(){
  const el=document.getElementById('lista-artistas');
  if(!artistasCache.length){el.innerHTML=vazio('Nenhum artista cadastrado ainda','🎤');return;}
  el.innerHTML=artistasCache.map(cardArtista).join('');
  ativarAnimacoes();
}

function ativarAnimacoes(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visivel');obs.unobserve(e.target);}});
  },{threshold:0.1});
  document.querySelectorAll('.animar:not(.visivel)').forEach(el=>obs.observe(el));
}

window.addEventListener('scroll',()=>{
  document.getElementById('btnTopo').classList.toggle('visivel',window.scrollY>400);
});

/* ============ RENDER ANÚNCIOS NA HOME ============ */
function renderizarAnuncios(lista){
  const secao = document.getElementById('secao-anuncios');
  const grid = document.getElementById('home-anuncios');
  if(!lista || !lista.length){
    secao.style.display = 'none';
    return;
  }
  const slot1 = lista.find(a => String(a.slot) === '1' && String(a.ativo).toUpperCase() === 'SIM');
  const slot2 = lista.find(a => String(a.slot) === '2' && String(a.ativo).toUpperCase() === 'SIM');
  const ativos = [slot1, slot2].filter(x => x);
  if(ativos.length === 0){
    secao.style.display = 'none';
    return;
  }
  secao.style.display = '';
  grid.innerHTML = ativos.map((a, i) => cardAnuncio(a, i)).join('');
}

/* ============ CARREGAMENTO PARALELO ============ */
async function carregarTudo(){
  document.getElementById('ano').textContent=new Date().getFullYear();
  mudarModo('visitante');

  const promessas = {
    redes:        apiGet('listar_redes').catch(e => ({ erro: e.message })),
    destaques:    apiGet('listar_destaques').catch(e => ({ erro: e.message })),
    anuncios:     apiGet('listar_anuncios').catch(e => ({ erro: e.message })),
    artistas:     apiGet('listar_artistas').catch(e => ({ erro: e.message })),
    eventos:      apiGet('listar_eventos').catch(e => ({ erro: e.message })),
    nexotv:       apiGet('listar_nexotv').catch(e => ({ erro: e.message })),
    ingressos:    apiGet('listar_ingressos').catch(e => ({ erro: e.message })),
    funcionarios: apiGet('listar_funcionarios').catch(e => ({ erro: e.message }))
  };

  const r = await Promise.all(Object.values(promessas));
  const dados = {};
  Object.keys(promessas).forEach((k, i) => dados[k] = r[i]);

  if(dados.redes.erro){
    document.getElementById('footer-redes').innerHTML='<span>Erro</span>';
    document.getElementById('lista-redes').innerHTML=vazio('Erro: '+dados.redes.erro,'⚠️');
  } else {
    const redes = dados.redes;
    const html = redes.length ? redes.map(rd=>`<a href="${rd.url}" target="_blank">${iconeRede(rd.nome)} ${rd.nome}</a>`).join('') : '<span>Em breve</span>';
    document.getElementById('footer-redes').innerHTML = html;
    document.getElementById('lista-redes').innerHTML = redes.length ? redes.map(cardRede).join('') : vazio('Nenhuma rede cadastrada','🔗');
  }

  if(dados.destaques.erro){
    document.getElementById('home-destaques').innerHTML = vazio('Erro: '+dados.destaques.erro,'⚠️');
  } else {
    const d = dados.destaques;
    document.getElementById('home-destaques').innerHTML = d.length ? d.map(cardDestaque).join('') : vazio('Nenhum destaque cadastrado ainda. Adicione em ✨ Destaques no admin.','✨');
  }

  if(!dados.anuncios.erro) renderizarAnuncios(dados.anuncios);
  else document.getElementById('secao-anuncios').style.display = 'none';

  if(dados.artistas.erro){
    document.getElementById('home-artistas').innerHTML=vazio('Erro: '+dados.artistas.erro,'⚠️');
    document.getElementById('lista-artistas').innerHTML=vazio('Erro: '+dados.artistas.erro,'⚠️');
  } else {
    const artistas = dados.artistas;
    artistasCache = artistas;
    document.getElementById('home-artistas').innerHTML = artistas.length ? artistas.slice(0,3).map(cardArtista).join('') : vazio('Nenhum artista cadastrado ainda','🎤');
    renderizarArtistas();
  }

  if(dados.eventos.erro){
    document.getElementById('home-eventos').innerHTML=vazio('Erro: '+dados.eventos.erro,'⚠️');
    document.getElementById('lista-eventos').innerHTML=vazio('Erro: '+dados.eventos.erro,'⚠️');
  } else {
    const eventos = dados.eventos;
    eventosCache = eventos;
    document.getElementById('home-eventos').innerHTML = eventos.length ? eventos.slice(0,3).map(cardEvento).join('') : vazio('Nenhum evento cadastrado ainda','🎪');
    document.getElementById('lista-eventos').innerHTML = eventos.length ? eventos.map(cardEvento).join('') : vazio('Nenhum evento cadastrado ainda','🎪');
  }

  if(dados.nexotv.erro){
    document.getElementById('home-nexotv').innerHTML=vazio('Erro: '+dados.nexotv.erro,'⚠️');
    document.getElementById('lista-nexotv').innerHTML=vazio('Erro: '+dados.nexotv.erro,'⚠️');
  } else {
    const tv = dados.nexotv;
    nexotvCache = tv;
    document.getElementById('home-nexotv').innerHTML = tv.length ? tv.slice(0,3).map(cardNexoTV).join('') : vazio('Sem publicações ainda','📺');
    document.getElementById('lista-nexotv').innerHTML = tv.length ? tv.map(cardNexoTV).join('') : vazio('Sem publicações ainda','📺');
  }

  if(dados.ingressos.erro){
    document.getElementById('lista-ingressos').innerHTML=vazio('Erro: '+dados.ingressos.erro,'⚠️');
  } else {
    const ing = dados.ingressos;
    ingressosCache = ing;
    document.getElementById('lista-ingressos').innerHTML = ing.length ? ing.map(cardIngresso).join('') : vazio('Nenhum ingresso cadastrado','🎟️');
  }

  if(dados.funcionarios.erro){
    document.getElementById('lista-funcionarios').innerHTML=vazio('Erro: '+dados.funcionarios.erro,'⚠️');
  } else {
    const func = dados.funcionarios;
    funcionariosCache = func;
    document.getElementById('lista-funcionarios').innerHTML = func.length ? func.map(cardFuncionario).join('') : vazio('Nenhum funcionário cadastrado','👥');
  }

  ativarAnimacoes();
}

carregarTudo();
</script>
